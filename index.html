<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pwned</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
    }

    .pwned {
      font-size: clamp(5rem, 20vw, 14rem);
      font-weight: 900;
      text-transform: lowercase;
      color: #ff0040;
      text-shadow:
        0 0 10px #ff0040,
        0 0 30px #ff0040,
        0 0 60px #ff0040,
        0 0 120px #cc0030;
      animation: flicker 3s infinite, glitch 6s infinite;
      letter-spacing: -0.02em;
      position: relative;
    }

    .pwned::before,
    .pwned::after {
      content: 'pwned';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .pwned::before {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      animation: glitch-before 6s infinite;
      clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
    }

    .pwned::after {
      color: #ff0040;
      text-shadow: 0 0 10px #ff0040;
      animation: glitch-after 6s infinite;
      clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
    }

    .subtitle {
      color: #333;
      font-size: clamp(0.7rem, 2vw, 1rem);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-top: 1rem;
      animation: fadein 2s ease-in;
    }

    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.08) 2px,
        rgba(0, 0, 0, 0.08) 4px
      );
      z-index: 10;
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.8; }
      97% { opacity: 1; }
      98% { opacity: 0.6; }
      99% { opacity: 1; }
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      91% { transform: translate(-3px, 1px); }
      92% { transform: translate(3px, -1px); }
      93% { transform: translate(0); }
    }

    @keyframes glitch-before {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      91% { transform: translate(-4px, 0); opacity: 0.8; }
      92% { transform: translate(4px, 0); opacity: 0.8; }
      93% { transform: translate(0); opacity: 0; }
    }

    @keyframes glitch-after {
      0%, 90%, 100% { transform: translate(0); opacity: 0; }
      91% { transform: translate(4px, 0); opacity: 0.7; }
      92% { transform: translate(-4px, 0); opacity: 0.7; }
      93% { transform: translate(0); opacity: 0; }
    }

    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="container">
    <div class="pwned">pwned</div>
    <div class="subtitle">you have been compromised</div>
  </div>
</body>
</html>
